<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Script Vault</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #05070c;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    /* =========================
       KEY SYSTEM
    ========================= */

    #keyPage {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 100, 255, 0.18),
          transparent 45%
        ),
        #05070c;
    }

    .keyBox {
      width: 100%;
      max-width: 420px;

      padding: 40px 30px;

      background: #0b101b;

      border: 1px solid #19355c;

      border-radius: 18px;

      text-align: center;

      box-shadow:
        0 0 50px rgba(0, 100, 255, 0.15);
    }

    .blueLine {
      width: 50px;
      height: 4px;

      margin: 0 auto 25px;

      border-radius: 10px;

      background: linear-gradient(
        90deg,
        #0066ff,
        #00aeff
      );
    }

    h1 {
      font-size: 32px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 12px;
      margin-bottom: 30px;

      color: #8492a6;

      font-size: 14px;
    }

    #keyInput {
      width: 100%;

      padding: 16px;

      border-radius: 10px;

      border: 1px solid #263852;

      background: #05080e;

      color: white;

      font-size: 15px;

      outline: none;
    }

    #keyInput:focus {
      border-color: #1683ff;

      box-shadow:
        0 0 15px
        rgba(0, 120, 255, 0.25);
    }

    #enterButton {
      width: 100%;

      margin-top: 15px;

      padding: 16px;

      border: none;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #0066ff,
          #00aaff
        );

      color: white;

      font-size: 15px;

      font-weight: bold;

      letter-spacing: 2px;
    }

    #message {
      height: 20px;

      margin-top: 15px;

      font-size: 13px;
    }


    /* =========================
       SCRIPT HUB
    ========================= */

    #hubPage {
      display: none;

      min-height: 100vh;

      padding: 25px;

      background:
        radial-gradient(
          circle at top,
          rgba(0, 100, 255, 0.12),
          transparent 35%
        ),
        #05070c;
    }

    .header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 30px;

      padding-bottom: 20px;

      border-bottom:
        1px solid #172033;
    }

    .logoText {
      font-size: 22px;

      font-weight: bold;

      letter-spacing: 2px;
    }

    .status {
      color: #1683ff;

      font-size: 12px;
    }

    .scriptGrid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;

      max-width: 1000px;

      margin: auto;
    }

    .scriptCard {
      min-height: 180px;

      padding: 25px;

      border-radius: 16px;

      background: #0b101b;

      border:
        1px solid #1a2b45;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.25);
    }

    .scriptNumber {
      color: #1683ff;

      font-size: 12px;

      letter-spacing: 2px;
    }

    .scriptCard h2 {
      margin-top: 15px;

      font-size: 20px;
    }

    .scriptCard p {
      margin-top: 10px;

      color: #7f8da3;

      font-size: 13px;

      line-height: 1.5;
    }

    .copyButton {
      margin-top: 20px;

      padding:
        10px
        18px;

      border-radius: 8px;

      border:
        1px solid #1e6fe8;

      background: transparent;

      color: #4ba3ff;

      font-weight: bold;
    }


    /* 휴대폰 화면 */

    @media (max-width: 600px) {

      .scriptGrid {
        grid-template-columns: 1fr;
      }

      #hubPage {
        padding: 18px;
      }

    }

  </style>
</head>


<body>


  <!-- KEY PAGE -->

  <div id="keyPage">

    <div class="keyBox">

      <div class="blueLine"></div>

      <h1>KEY SYSTEM</h1>

      <p class="subtitle">
        Enter your access key to continue
      </p>


      <input
        id="keyInput"
        type="password"
        placeholder="ENTER YOUR KEY"
      >


      <button id="enterButton">
        ENTER →
      </button>


      <p id="message"></p>

    </div>

  </div>



  <!-- SCRIPT HUB -->

  <div id="hubPage">

    <div class="header">

      <div class="logoText">
        SCRIPT VAULT
      </div>

      <div class="status">
        ● ACCESS GRANTED
      </div>

    </div>


    <div class="scriptGrid">


      <div class="scriptCard">

        <div class="scriptNumber">
          Rivals script
        </div>

        <h2>KiciaHook</h2>

        <p>
          라이벌 스크립트
        </p>

        <button
  class="copyButton"
  data-script='loadstring(game:HttpGet("https://raw.githubusercontent.com/kiciahook/kiciahook/refs/heads/main/loader.luau"))()'
>
  COPY SCRIPT
        </button>
          
        

      </div>



      <div class="scriptCard">

        <div class="scriptNumber">
          grow a garden 2 script
        </div>

        <h2>grow a garden 2</h2>

        <p>
          그로어 가든 2 스크립트
        </p>

        <button
  class="copyButton"
  data-script='준비중'
>
  COPY SCRIPT
        </button>
          
        

      </div>



      <div class="scriptCard">

        <div class="scriptNumber">
          준비중
        </div>

        <h2>준비중</h2>

        <p>
          공백
        </p>

        <button class="copyButton">
          COPY SCRIPT
        </button>

      </div>



      <div class="scriptCard">

        <div class="scriptNumber">
          준비중
        </div>

        <h2>준비중</h2>

        <p>
          공백
        </p>

        <button class="copyButton">
          COPY SCRIPT
        </button>

      </div>


    </div>

  </div>



  <script>

    const keyInput =
      document.getElementById("keyInput");

    const enterButton =
      document.getElementById("enterButton");

    const message =
      document.getElementById("message");

    const keyPage =
      document.getElementById("keyPage");

    const hubPage =
      document.getElementById("hubPage");


    const correctKey = "SCRIPT2026";


    function enterSite() {

      const enteredKey =
        keyInput.value.trim();


      if (enteredKey === correctKey) {

        message.style.color = "#39a5ff";

        message.textContent =
          "ACCESS GRANTED ✓";


        setTimeout(function () {

          keyPage.style.display = "none";

          hubPage.style.display = "block";

        }, 500);


      } else {

        message.style.color = "#ff4d5e";

        message.textContent =
          "INVALID KEY";

      }

    }


    enterButton.addEventListener(
      "click",
      enterSite
    );


    keyInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          enterSite();

        }

      }
    );
const copyButtons = document.querySelectorAll(".copyButton");

copyButtons.forEach(function(button) {

  button.addEventListener("click", function() {

    const script = button.getAttribute("data-script");

    navigator.clipboard.writeText(script);

    const originalText = button.textContent;

    button.textContent = "COPIED ✓";

    setTimeout(function() {
      button.textContent = originalText;
    }, 1500);

  });

});
  </script>


</body>
</html>
